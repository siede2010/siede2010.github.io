<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body style="background-color: darkblue;">
    <style>
.test {
    color:blue
}

.free {
    position: absolute;
}

.full {
    position: absolute;
    left: 0;
    right: 0;
    top: 0;
    bottom: 0;
}
#pandWarnText {
    position: absolute;
    left: 50%;
    bottom: 75%;
    top: auto;
    text-align: center;
    font-size: 4vw;
    border-style: solid;
    border-width: 0;
    border-bottom-width: 0.4vw;
    font-family: cursive;
    text-shadow: 2px 0 WHITE, -2px 0 WHITE, 0 2px WHITE, 0 -2px WHITE, 1px 1px WHITE, -1px 1px WHITE, -1px -1px WHITE, 1px -1px WHITE;
    transform: translate(-50%, 0);
    transform-origin: left;
    width: max-content;
}

#pandCog {
    position: absolute;
    left: 50%;
    top: 50%;
    transform : translate(-50%,-50%);
    transform-origin:top left;
    width: 20vh;
}

#pandCursor {
    position : absolute;
    left: 0;
    top: 0;
    width: 6vh;
    height: 6vh;
}

#underWarnText {
    width: 100%;
    height: 100%;
    border-style: solid;
    border-color: white;
    border-width: 0;
    border-bottom-width: 1.2vw;
}

.bar {
    position: absolute;
    left: 50%;
    background-color: white;
    top: calc(50% + 11vh);
    transform: translate(-50%, 0);
    transform-origin: top left;
    width: 20vh;
    height: 2vh;
}

.barPause {
    background-color: gray;
}

.barDrain {
    background-color: red;
}

#pand {
    position: absolute;
    left: 50%;

    width: 100vh;
    height: 100vh;
    transform: translate(-50%, 0);
    transform-origin: top left;
}
</style>
    <script>

document.body.style.overflow = "hidden";

let pandArea = document.createElement("div");
pandArea.style.zIndex = 999;
document.body.append(pandArea);

/** @type {HTMLElement}*/ let header = document.createElement("div");
header.id = "pandWarnText";
header.classList.add("free");
header.style.zIndex = 10;

let hText = document.createElement("div");
hText.innerText = "Waiting...";
header.append(hText);

pandArea.append(header);
pandArea.classList.add("full");

let flickerOverlay = document.createElement("div");
document.body.append(flickerOverlay);
flickerOverlay.classList.add("full");
flickerOverlay.style.zIndex = 9999;
flickerOverlay.style.opacity = 1;
flickerOverlay.style.backgroundColor = "BLACK";

let pandImage = document.createElement("img");
pandImage.src = "https://od.lk/s/ODJfMTU2NDA3NDUwXw/pandEdited.png";
pandImage.id = "pand";
pandArea.append(pandImage)

let areaImg = document.createElement("img");
areaImg.src = "https://od.lk/s/ODJfMTU2NDA2ODI0Xw/cog.png";
areaImg.id = "pandCog";
areaImg.alt = "Cog";
areaImg.style.zIndex = 97;

let progressBar = document.createElement("div");
progressBar.classList.add("bar");

let pandCursor = document.createElement("img");
pandCursor.src = "https://od.lk/s/ODJfMTU2NDE2MTE0Xw/cursor.png";
pandCursor.id = "pandCursor";
pandCursor.alt = "Cursor";
pandCursor.style.zIndex = 99;

/** @type {HTMLAudioElement} */
let music = document.getElementsByTagName("audio")["file-75704802-ItsHere"];
if (music == null) {
  music = document.createElement("audio");
  music.preload = "preload";
  music.id = "file-75704802-ItsHere";
  music.src =
    "https://od.lk/s/ODJfMTU2NDA3NTI4Xw/Stutter%20%5BBreakcore%5D.mp3";
  document.body.append(music);
}

function loadAudio(src) {
  let audio = document.createElement("audio");
  audio.src = src
  audio.preload = "auto"
  document.body.append(audio)
  return audio
}

let audio_wander = loadAudio("https://od.lk/s/ODJfMTU2NDQzMjEyXw/Pand_.mp3");
audio_wander.loop = true;

let audio_chase = loadAudio("https://od.lk/s/ODJfMTU2NDQzMjE3Xw/Pand_Chase.mp3");
audio_chase.loop = true;

let slamFiles = [
  "https://od.lk/s/ODJfMTU2NDQzMjI0Xw/slam1.mp3",
  "https://od.lk/s/ODJfMTU2NDQzMjIwXw/slam2.mp3",
  "https://od.lk/s/ODJfMTU2NDQzMjIxXw/slam3.mp3",
  "https://od.lk/s/ODJfMTU2NDQzMjIzXw/slam4.mp3",
];

let slamAudio = []

for (let file of slamFiles)
  slamAudio.push(loadAudio(file))

pandArea.append(progressBar);
pandArea.append(pandCursor);
pandArea.append(areaImg);

let gameState = "WaitingStart";
let gameStateDelta = 0;

let stability = 100;
let stabilityDrainRate = 0;

areaImg.style.opacity = 0;
pandImage.style.opacity = 0;

let shake = 0;
let flag = {
  pandAreaMove : false,
  cinematicSlams : false,
  extraDrain : false,
  damageZones : false
}

let cogShakeMult = 6;
let cogPos = { x: 50, y: 50 };
let pandAreaGoal = { x: 50, y : 50 };
let cogRot = 0;
function updateCog(currentTime) {
  cogRot = currentTime / 10;
  areaImg.style.rotate =
    ((cogRot + Math.random() * cogShakeMult * shake) % 360) + "deg";
  areaImg.style.left = `calc(${cogPos.x}% + ${Math.round((Math.random() - 0.5) * cogShakeMult * shake)}px)`;
  areaImg.style.top = `calc(${cogPos.y}% + ${Math.round((Math.random() - 0.5) * cogShakeMult * shake)}px)`;
}

let cursorPos = { x: 0, y: 0 };
let cursorVelocity = { x: 0, y: 0 };

function clampCursor() {
  cursorPos.x = Math.min(
    Math.max(0, cursorPos.x),
    window.innerWidth - pandCursor.clientWidth,
  );
  cursorPos.y = Math.min(
    Math.max(0, cursorPos.y),
    window.innerHeight - pandCursor.clientHeight,
  );
}

document.addEventListener("click", (e) => {
  if (gameState == "End") return;
  if (gameState == "Hide") {
    gameState = "Intro";
    gameStateDelta = 0;
    hText.innerText = "Keep your cursor in the middle";
    stability = 100;
  }
  if (document.pointerLockElement) return; // already set.
  pandArea.requestPointerLock();
  cursorPos.x = e.clientX;
  cursorPos.y = e.clientY;
  clampCursor();
});

document.addEventListener("mousemove", (e) => {
  //console.log(e.movementX,e.movementY)
  if (document.pointerLockElement) {
    cursorPos.x += e.movementX;
    cursorPos.y += e.movementY;
    clampCursor();
  }
});

function inCircle() {
  let len = Math.sqrt((areaImg.offsetLeft - cursorPos.x) ** 2 + (areaImg.offsetTop - cursorPos.y) ** 2);
  return len <= areaImg.clientWidth / 2;
}

currentPhase = 0
musicPhase = [
  {
    start : 0,
    gameName : "Phase 1",
    slam : {
      chance : -1,
      max : 0,
      slamRange : {
        min : 1.4,
        max : 2.6
      }
    }
  },
  {
    start : 17,
    gameName : "Phase 2",
    slam : {
      chance : -1,
      max : 0,
      slamRange : {
        min : 1.2,
        max : 2
      }
    }
  },
  {
    start : 51,
    gameName : "Intermission 1",
    slam : {
      chance : -1,
      max : 0,
      slamRange : {
        min : 3,
        max : 6
      }
    }
  },
  {
    start : 68,
    gameName : "Phase 3",
    slam : {
      chance : 0.3,
      max : 2,
      slamRange : {
        min : 1,
        max : 1.6
      }
    }
  },
  {
    start : 85,
    gameName : "Intermission 2",
    slam : {
      chance : 1,
      max : 2,
      slamRange : {
        min : 3,
        max : 5
      }
    }
  },
  {
    start : 102,
    gameName : "Phase 4",
    slam : {
      chance : 0.5,
      max : 5,
      slamRange : {
        min : 0.7,
        max : 1.3
      }
    }
  },
  {
    start : 135,
    gameName : "Phase 5",
    slam : {
      chance : 1,
      max : 8,
      slamRange : {
        min : 0.7,
        max : 1.5
      }
    }
  },
  {
    start : 161,
    gameName : "Final Phase",
    slam : {
      chance : -1,
      max : 0,
      slamRange : {
        min : 0.2,
        max : 0.3
      }
    }
  },
  {
    start : 171,
    gameName : "Post Phase",
    slam : {
      chance : -1,
      max : 0,
      slamRange : {
        min : 99999,
        max : 99999
      }
    },
    refill: 1
  },
  {
    start : NaN
  }
]

let nextSlam = 0;
let multiSlamCount = 0;
let maxSlamCount = 3;
let multiSlamChance = 1;
let slamRange = {
  min : 0.7,
  max : 1.3
}

function nextPhase() {
  let newPhase = musicPhase[currentPhase++]
  gameState = newPhase.gameName
  let newSlam = newPhase.slam
  multiSlamChance = newSlam.chance
  maxSlamCount = newSlam.max
  slamRange = newSlam.slamRange
  gameStateDelta %= 1
  nextSlam = 0
  if (newPhase.refill) {
    stability += 30
    
  }
  newSlamTimer()
}

function slam() {
    let dir = Math.random() * Math.PI * 2;
    let power = 140;
    cursorVelocity.x += Math.cos(dir) * power;
    cursorVelocity.y += -Math.sin(dir) * power;
    shake = 2;
    let stabMult = 1
    if (flag.extraDrain)
      stabMult = 1.4
    if (flag.cinematicSlams)
      stability += (100 - stability) * 0.12 * stabMult;
    else
      stability += 10 * stabMult;
    stability = Math.min(stability, 100);
    let slamSound = slamAudio[Math.floor(Math.random() * slamAudio.length)];

    if (flag.pandAreaMove) {
      pandAreaGoal.x = (Math.random() - 0.5) / 0.5 * 20 + 50
      pandAreaGoal.y = ((Math.random() - 0.5) / 0.5) * 10 + 50;
    }

    slamSound.play()
    slamSound.currentTime = 0
    newSlamTimer()
}
function newSlamTimer() {
  let lastSlam = nextSlam;

    nextSlam += Math.random() * slamRange.min + (slamRange.max - slamRange.min);
    if (multiSlamCount == 0) {
      if (Math.random() < multiSlamChance)
        multiSlamCount = 1 + Math.ceil(Math.random() * (maxSlamCount - 1));
    } else {
      multiSlamCount -= 1;
      nextSlam = lastSlam + Math.random() * 0.1 + 0.2;
    }
}

function updateCursor(delta) {


  cursorPos.x += cursorVelocity.x * 80 * delta;
  cursorPos.y += cursorVelocity.y * 80 * delta;
  cursorVelocity.x *= Math.exp(-16 * delta);
  cursorVelocity.y *= Math.exp(-16 * delta);
  clampCursor();
  pandCursor.style.left = cursorPos.x + "px";
  pandCursor.style.top = cursorPos.y + "px";
  pandCursor.style.opacity = document.pointerLockElement ? 1 : 0;

  if (inCircle() || stabilityDrainRate == 0) {
    stability += 60 * delta;
    progressBar.classList.remove("barDrain");
    stability = Math.min(stability, 100);
  } else {
    let drain = 40
    if (flag.extraDrain)
      drain = 60
    stability -= drain * delta;
    progressBar.classList.add("barDrain");
    stability = Math.max(stability, 0);
  }
}

function updateState(delta) {
  gameStateDelta += delta;

  pandImage.style.left = `calc(50% + ${(Math.random() - 0.5) * 10}px)`
  pandImage.style.top = `${(Math.random() - 0.5) * 10}px`;
  pandImage.style.rotate = (Math.random() - 0.5) * 2 + "deg";

  shake = Math.max(0, shake - 2 * delta);

  let lerpFactor = 1 - Math.exp(-14 * delta);
  cogPos.x += (pandAreaGoal.x - cogPos.x) * lerpFactor;
  cogPos.y += (pandAreaGoal.y - cogPos.y) * lerpFactor;

  pandArea.style.rotate = `${Math.round((Math.random() - 0.5) * 2 * shake)}deg`;

  if (gameState == "Hide") {
    flickerOverlay.style.opacity = Math.random() * 0.5 + 0.1;
    if (gameStateDelta > 5) {
      let dieDulst = document.getElementById("customInterract1");
      if (dieDulst) dieDulst.children[0].click();
      gameState = "End";
    }
  } else if (gameState == "Intro") {
    flickerOverlay.style.opacity =
      0.9 - (0.9 * gameStateDelta) / (gameStateDelta + 0.02);
  } else {
    flickerOverlay.style.opacity = 0;
  }

  if (["PreHide", "Hide", "WaitingStart"].includes(gameState)) {
    areaImg.style.opacity = 0;
    progressBar.style.opacity = 0;
    pandImage.style.left = "-10%"
    pandImage.style.rotate = "-30deg"
    stabilityDrainRate = 0;
    pandImage.style.opacity = 0;
    audio_chase.volume = 1
  } else if (gameState == "Intro") {
    let sway = (gameStateDelta / (gameStateDelta + 0.2))
    let swayMax = (2 * gameStateDelta / (gameStateDelta + 2))
    areaImg.style.opacity = 1 * sway;
    progressBar.style.opacity = 1 * sway;
    stabilityDrainRate = 1 * (gameStateDelta / (gameStateDelta + 2));
    pandImage.style.opacity = 0.3 + 0.7 * sway;
    pandImage.style.rotate = (30 * swayMax - 30 + (Math.random() - 0.5) * 2 * (1 - swayMax)) + "deg";
    pandImage.style.left = (60 * swayMax - 10 + (Math.random() - 0.5) * 10 * (1 - swayMax)) + "%";
    audio_chase.volume = 1 - 0.95 * swayMax
  } else {
    areaImg.style.opacity = 1;
    progressBar.style.opacity = 1;
    stabilityDrainRate = 1;
    pandImage.style.opacity = 1;
    audio_chase.volume = 0.05;

    if (music.currentTime > (musicPhase[currentPhase]?.start ?? 0))
      nextPhase()

    if (gameStateDelta > nextSlam) {
      slam();
    }
  }

  if (audio_chase.currentTime > audio_chase.duration - 0.5)
    audio_chase.currentTime -= audio_chase.duration - 1;

  progressBar.style.width = 0.2 * stability + "vh";

  if (gameState == "PreHide") {
    pandArea.style.opacity = 1 * gameStateDelta / (gameStateDelta + 0.2);
    if (gameStateDelta > 4) {
      audio_chase.play();
      audio_wander.pause()
      gameState = "Hide";
      hText.innerText = "Click to Hide!";
      gameStateDelta = (gameStateDelta % 2) - 2;
      pandArea.style.opacity = 1;
    }
  }

  if (gameState == "Intro") {
    if (gameStateDelta > 2) {
      nextPhase();
    }
  }

  if (gameState == "Intermission 1") {
    if (gameStateDelta < 3)
      hText.innerText = "..."
    else if (gameStateDelta < 5)
      hText.innerText = "Formidable..."
    else if (gameStateDelta < 8)
      hText.innerText = "That Flimsy Locker will not keep you safe..."
    else
      hText.innerText = "Good luck."
  } else if (gameState == "Phase 3") {
    hText.innerText = "Keep your cursor in the middle";
    flag.pandAreaMove = true;
  } else if (gameState == "Intermission 2") {
    flag.extraDrain = true;
    if (gameState < 5)
      hText.innerText = "Truly Annoying...";
    else if (gameState < 10)
      hText.innerText = "Won't you Gods come out and FIGHT ME?!";
    else if (gameState < 16) {
      hText.innerText = "Truly Pitiful... Lets see you survive This...";
      damageZones = true
    }
  } else if (gameState == "Phase 4") {
    hText.innerText = "Keep your cursor in the middle";
  } else if (gameState == "Final Phase") {
    flag.cinematicSlams = true;
  } else if (gameState == "Post Phase") {
    flag.cinematicSlams = false;
    pandAreaGoal.x = 50
    pandAreaGoal.y = 50
  }
}

let lastCurrentTime = null;
function update(currentTime) {
  if (lastCurrentTime == null) lastCurrentTime = currentTime;
  let delta = currentTime - lastCurrentTime;
  delta = isNaN(delta) ? 0 : delta / 1000;
  lastCurrentTime = currentTime;
  updateCog(currentTime);
  updateCursor(delta);
  updateState(delta);
  //console.log(delta);
  if (gameState == "End") return; // end loop.
  window.requestAnimationFrame(update);
}

document.addEventListener(
  "click",
  async () => {
    await audio_wander.play();
    await music.play();

    if (gameState == "WaitingStart") {
      hText.innerText = "Uhh ohh...";
      gameStateDelta = 0;
      gameState = "PreHide";
      pandArea.style.opacity = 0;
    }
  },
  { once: true },
);
audio_wander.play();
update();

</script>
</body>
</html>
